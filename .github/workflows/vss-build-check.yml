name: Visual Studio x64 release Build Check

on:
    push:
        branches: [stable]
    pull_request:
        branches: [stable]

permissions:
    contents: read

jobs:
    build:
        name: Visual Studio x64 release Build Check
        runs-on: windows-latest

        steps:
            - name: Check out code from GitHub
              uses: actions/checkout@v7

            - name: Setup MSBuild
              uses: microsoft/setup-msbuild@v3

            - name: Building project
              shell: bash
              run: |
                  msbuild.exe src/bios.sln -t:Rebuild -p:Configuration=Release -p:Platform=x64

            - name: Verify build outputs
              shell: bash
              run: |
                  expected=(
                      "src/x64/Release/bios.exe"
                  )

                  for file in "${expected[@]}"; do
                      if [[ ! -f "$file" ]]; then
                          echo "::error::Build output missing: $file"
                          exit 1
                      else
                          echo "OK: $file"
                      fi
                  done

            - name: Compute Commit SHA
              id: vars
              shell: bash
              run: |
                  echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Archive artifact
              uses: actions/upload-artifact@v7
              with:
                  name: bios_${{ steps.vars.outputs.sha_short }}
                  path: |
                      src/x64/Release/bios.exe
