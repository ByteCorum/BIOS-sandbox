---
version: 2
updates:
    # GitHub Actions version updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore"
          include: "scope"
      labels:
          - "type: maintenance"
          - "size: S"

    # Native (git) submodules and vendored dependency updates
    - package-ecosystem: "gitsubmodule"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore"
          include: "scope"

    # Docker base-image updates
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore"
          include: "scope"
